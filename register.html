<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <h1>Регистрация</h1>
    </header>

    <main>
      <form action="#" method="post">
        <label for="username"
          >Имя пользователя:</label>
          <input type="text" id="username" name="username" required /><br /><br
        />
        <label for="email" id="email" name="email" required >Электронная почта:</label>
        <input type="email" id="email" name="email" required /><br /><br />
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required /><br /><br />
        <label for="confirm-password">Подтверждение пароля:</label>
        <input type="password" id="confirm-password" name="confirm-password" required /><br /><br />
        <label for="age" id="age" name="age" type="date" >Дата рождения:</label>
        <input type="date" id="age" name="age" required /><br /><br />
        <label for="region" id="region" name="region" >Регион:</label>
        <select id="region" name="region" required>
          <option value="">Выберите регион</option>
          <option value="region1">Регион 1</option>
          <option value="region2">Регион 2</option>
          <option value="region3">Регион 3</option>
        </select><br /><br />
        <label for="button" id="button" name="button" >Подтвердить:</label>
        <button type="submit" id="submit-btn reg">Зарегистрироваться</button><br /><br />

      </form>
    </main>

    <footer>
      <p><a href="index.html">На главную</a></p>
      <a href="add-receipe.html">Добавить рецепт</a>
    </footer>
  </body>
</html>

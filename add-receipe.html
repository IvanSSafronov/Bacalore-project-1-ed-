<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="fonts" href="FjallaOne-Regular.ttf">
    <title>Document</title>
</head>
<body>
    <h1>Добавить рецепт</h1>
    <main>
    
    <form action="#" method="post">
        <label for="recipe-name">Название рецепта:</label>
        <input type="text" id="recipe-name" name="recipe-name" required><br><br>

        <label for="ingredients">Ингредиенты:</label>
        <textarea id="ingredients" name="ingredients" required></textarea><br><br>

        <label for="instructions">Инструкции:</label>
        <textarea id="instructions" name="instructions" required></textarea><br><br>

        <label for="cooking-time">
Время приготовления (в минутах):</label>
<input type="number" id="time" name="cooking-time" min="1" required><br><br>
        </label>

        <label for="difficult" >Сложность:</label>
        <input type="radio" id="easy" name="difficult" value="easy" required> Легкий
        <input type="radio" id="medium" name="difficult" value="medium" required> Средний
        <input type="radio" id="hard" name="difficult" value="hard" required> Сложный

        <label for="category">Категория:</label>
        <table>
    <caption>Пищевая ценность</caption>
    <thead>
        <tr>
            <th>Ингредиент</th>
            <th>Количество</th>
            <th>Калории</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td ><input type="text" id="ingredient" name="ingredient" required></td>
            <td ><input type="number" id="quantity" name="quantity" min="1" required></td>
            <td ><input type="number" id="calories" name="calories" min="1" required></td>
        </tr>
        <br><br>
        <tr>
            <td colspan="2">Итого</td>
            <td><input type="number" id="total-calories" name="total-calories" min="1" required></td>
        </tr>
    </tbody>
</table>

        <br><br><label for="describe">Описание:</label> <br><br>
        <textarea id="describe" name="describe"></textarea><br><br>

        <button type="submit" id="submit-btn rec">Добавить рецепт</button>
    </form>
    <br>
    </main>
    <footer>
        <p><a href="index.html">На главную</a></p>
        <a href="register.html">Зарегистрироваться</a>
    </footer>
</body>
</html>
